<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="com.majoris.disks.Sanitization"/></policy>
  <policy context="default">
    <allow send_destination="com.majoris.disks.Sanitization" send_interface="com.majoris.disks.Sanitization" send_member="Review"/>
    <allow send_destination="com.majoris.disks.Sanitization" send_interface="com.majoris.disks.Sanitization" send_member="Start"/>
    <allow send_destination="com.majoris.disks.Sanitization" send_interface="com.majoris.disks.Sanitization" send_member="ListOperations"/>
  </policy>
</busconfig>
