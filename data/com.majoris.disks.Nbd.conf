<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="com.majoris.disks.Nbd"/></policy>
  <policy context="default">
    <allow send_destination="com.majoris.disks.Nbd" send_interface="com.majoris.disks.Nbd" send_member="Attach"/>
    <allow send_destination="com.majoris.disks.Nbd" send_interface="com.majoris.disks.Nbd" send_member="Detach"/>
  </policy>
</busconfig>
